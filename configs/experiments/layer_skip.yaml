# Layer Skipping Experiment Configuration
experiment:
  name: "layer_skip"
  description: "Evaluate random and fixed layer skipping strategies"

layer_skip:
  strategies:
    - name: "random_25"
      method: "random"
      skip_ratio: 0.25
      num_trials: 5

    - name: "random_50"
      method: "random"
      skip_ratio: 0.50
      num_trials: 5

    - name: "fixed_even"
      method: "fixed"
      skip_indices: "even"  # Skip even-indexed layers

    - name: "fixed_odd"
      method: "fixed"
      skip_indices: "odd"   # Skip odd-indexed layers

    - name: "fixed_middle"
      method: "fixed"
      skip_range: [12, 24]  # Skip middle layers

evaluation:
  metrics:
    - "tokens_per_second"
    - "ttft"
    - "tpot"
    - "peak_vram_mb"
    - "perplexity_delta"
    - "output_quality"
