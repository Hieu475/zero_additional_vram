# Qwen2.5-3B-Instruct Model Configuration
model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  revision: "main"  # Pin specific revision for reproducibility
  dtype: "float16"
  quantization:
    enabled: true
    bits: 4
    quant_type: "nf4"
    compute_dtype: "float16"
    use_double_quant: true
  device: "cuda:0"
  trust_remote_code: true

tokenizer:
  name: "Qwen/Qwen2.5-3B-Instruct"
  padding_side: "left"
  truncation: true

hardware:
  gpu: "RTX 4050 Laptop"
  vram_gb: 6
  vram_budget_gb: 5.5  # Leave headroom
