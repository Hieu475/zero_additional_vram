[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-additional-vram-ss"
version = "0.1.0"
description = "Zero-Additional-VRAM Self-Speculative Decoding for memory-constrained LLM inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers==5.14.1",
    "accelerate",
    "datasets",
    "evaluate",
    "huggingface_hub",
    "safetensors",
    "sentencepiece",
    "bitsandbytes",
    "scipy",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "pynvml",
    "psutil",
    "pyyaml",
    "tqdm",
    "rich",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
zassd = "zassd.cli:main"

