[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-additional-vram-ss"
version = "0.1.0"
description = "Exact speculative decoding under shape-dependent 4-bit quantized kernels (B1 fixed-row schedule)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "triton",
    "transformers==5.14.1",
    "accelerate",
    "bitsandbytes",
    "huggingface_hub",
    "safetensors",
    "numpy",
    "scipy",
    "pynvml",
    "pyyaml",
]

[project.optional-dependencies]
analysis = ["matplotlib", "datasets"]
hqq = ["hqq", "gemlite"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

