[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-additional-vram-ss"
version = "0.1.0"
description = "Zero-Additional-VRAM Self-Speculative Decoding for memory-constrained LLM inference"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
